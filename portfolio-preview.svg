<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1840" viewBox="0 0 1440 1840" role="img" aria-labelledby="title desc">
<title id="title">Koushik Reddy portfolio visual preview</title><desc id="desc">A design mockup showing the refreshed portfolio navigation, hero, about section, experience timeline, project cards, and competitive programming stats.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f9fc"/><stop offset="1" stop-color="#f0efff"/></linearGradient><linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#635bff"/><stop offset="1" stop-color="#00a6a6"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eeedff"/><stop offset="1" stop-color="#e1f7f5"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1d2344" flood-opacity=".09"/></filter></defs>
