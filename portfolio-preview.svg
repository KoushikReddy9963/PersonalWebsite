<rect x="0" y="0" width="1440" height="78" fill="#ffffff" fill-opacity=".94"/><path d="M0 77H1440" stroke="#e4e6f0"/>
<text x="100" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#171923">Koushik<tspan fill="#635bff">.</tspan></text>
<g font-family="Arial,sans-serif" font-size="15" fill="#626779"><text x="755" y="46">About</text><text x="835" y="46">Experience</text><text x="950" y="46">Projects</text><text x="1030" y="46">Skills</text><text x="1088" y="46">Coding</text><text x="1160" y="46">Contact</text></g><circle cx="1272" cy="39" r="20" fill="#fff" stroke="#e4e6f0"/><text x="1265" y="45" font-family="Arial,sans-serif" font-size="18" fill="#635bff">☾</text>
<circle cx="1275" cy="270" r="200" fill="#635bff" opacity=".05"/><circle cx="111" cy="550" r="110" fill="#00a6a6" opacity=".05"/>
<text x="105" y="190" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#635bff">● SOFTWARE ENGINEER · BENGALURU, INDIA</text>
<text x="100" y="275" font-family="Arial,sans-serif" font-size="57" font-weight="700" letter-spacing="-2" fill="#171923">Building reliable systems.</text><text x="100" y="345" font-family="Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="-2" fill="url(#grad)">Solving meaningful problems.</text>
<text x="103" y="405" font-family="Arial,sans-serif" font-size="20" fill="#626779">I'm Yennam Sai Koushik Reddy — a software engineer who enjoys</text><text x="103" y="436" font-family="Arial,sans-serif" font-size="20" fill="#626779">backend engineering, developer tooling, cloud-native systems,</text><text x="103" y="467" font-family="Arial,sans-serif" font-size="20" fill="#626779">and thoughtful web experiences.</text>
<rect x="102" y="510" width="190" height="54" rx="27" fill="#635bff"/><text x="130" y="543" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Explore my work ↗</text><rect x="307" y="510" width="170" height="54" rx="27" fill="#fff" stroke="#d8d9e5"/><text x="340" y="543" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#252638">Get in touch</text>
<g font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#626779"><text x="105" y="610">GitHub ↗</text><text x="205" y="610">LinkedIn ↗</text><text x="322" y="610">Email ↗</text></g>
<g transform="translate(1000 330)"><rect x="-90" y="-90" width="180" height="180" rx="24" fill="url(#card)" stroke="#a6a2ff" transform="rotate(-10)"/><rect x="-70" y="-70" width="140" height="140" rx="18" fill="#dcd9ff" stroke="#635bff" transform="rotate(12)"/><text x="-32" y="15" font-family="monospace" font-size="55" font-weight="700" fill="#635bff">{ }</text><rect x="-150" y="-175" width="190" height="50" rx="14" fill="#fff" stroke="#e2e4ee" filter="url(#shadow)"/><text x="-128" y="-144" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#252638">⌘  Backend systems</text><rect x="20" y="150" width="190" height="50" rx="14" fill="#fff" stroke="#e2e4ee" filter="url(#shadow)"/><text x="43" y="181" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#252638">◈  Cloud &amp; DevOps</text></g>
<path d="M0 690H1440" stroke="#e6e7f0"/><text x="720" y="754" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#635bff">A LITTLE ABOUT ME</text><text x="720" y="808" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#171923">Curiosity into <tspan fill="url(#grad)">craft.</tspan></text><text x="720" y="846" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#626779">I like understanding how systems work end to end — from APIs and data models</text><text x="720" y="872" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#626779">to deployment pipelines and the interfaces developers use every day.</text>
<rect x="150" y="915" width="1140" height="215" rx="24" fill="#fff" stroke="#e3e5ef" filter="url(#shadow)"/><rect x="190" y="950" width="145" height="145" rx="22" fill="url(#card)"/><circle cx="262" cy="1003" r="32" fill="#c8c4ff"/><path d="M220 1070 Q262 1008 304 1070" fill="#635bff" opacity=".75"/><text x="375" y="970" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#171923">Engineer by profession, problem-solver by habit.</text><text x="375" y="1010" font-family="Arial,sans-serif" font-size="16" fill="#626779">Backend services, authorization, configuration tooling, API security,</text><text x="375" y="1037" font-family="Arial,sans-serif" font-size="16" fill="#626779">and full-stack applications. I turn repetitive engineering work into</text><text x="375" y="1064" font-family="Arial,sans-serif" font-size="16" fill="#626779">reliable, reusable workflows.</text><rect x="375" y="1080" width="330" height="28" rx="14" fill="#eeedff"/><text x="390" y="1099" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#635bff">IIIT SRI CITY · CSE · 9.17 / 10</text>
<text x="720" y="1202" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#635bff">SELECTED WORK</text><text x="720" y="1254" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#171923">Things I've <tspan fill="url(#grad)">built.</tspan></text>
<g filter="url(#shadow)"><rect x="100" y="1300" width="380" height="315" rx="20" fill="#fff" stroke="#e2e4ee"/><rect x="100" y="1300" width="380" height="120" rx="20" fill="url(#card)"/><rect x="100" y="1400" width="380" height="20" fill="url(#card)"/><text x="125" y="1332" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#626779">01 / FULL STACK</text><text x="290" y="1375" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#635bff">⌂ EstateCraft</text><text x="125" y="1460" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#171923">EstateCraft</text><text x="125" y="1493" font-family="Arial,sans-serif" font-size="14" fill="#626779">Real-estate platform with role-based access,</text><text x="125" y="1517" font-family="Arial,sans-serif" font-size="14" fill="#626779">property listings, analytics and payments.</text><text x="125" y="1553" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#635bff">Redis caching cut dashboard latency by 50%.</text><text x="125" y="1590" font-family="Arial,sans-serif" font-size="13" fill="#626779">React · Express · MongoDB · Redis</text>
<rect x="530" y="1300" width="380" height="315" rx="20" fill="#fff" stroke="#e2e4ee"/><rect x="530" y="1300" width="380" height="120" rx="20" fill="url(#card)"/><rect x="530" y="1400" width="380" height="20" fill="url(#card)"/><text x="555" y="1332" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#626779">02 / APPLIED ML</text><g stroke="#635bff" stroke-width="7" stroke-linecap="round"><path d="M640 1360h160"/><path d="M650 1380h120"/><path d="M670 1400h145"/></g><text x="555" y="1460" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#171923">U-Net for OCR</text><text x="555" y="1493" font-family="Arial,sans-serif" font-size="14" fill="#626779">Text-line segmentation for historical</text><text x="555" y="1517" font-family="Arial,sans-serif" font-size="14" fill="#626779">manuscripts with an OpenCV pipeline.</text><text x="555" y="1553" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#635bff">0.75 IoU · ICDAR 2025 competition</text><text x="555" y="1590" font-family="Arial,sans-serif" font-size="13" fill="#626779">Python · TensorFlow · OpenCV</text>
<rect x="960" y="1300" width="380" height="315" rx="20" fill="#fff" stroke="#e2e4ee"/><rect x="960" y="1300" width="380" height="120" rx="20" fill="url(#card)"/><rect x="960" y="1400" width="380" height="20" fill="url(#card)"/><text x="985" y="1332" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#626779">03 / WEB APP</text><text x="1150" y="1380" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#635bff">✳ Nourish Nest</text><text x="985" y="1460" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#171923">Nourish Nest</text><text x="985" y="1493" font-family="Arial,sans-serif" font-size="14" fill="#626779">Diet-planning platform with recipes,</text><text x="985" y="1517" font-family="Arial,sans-serif" font-size="14" fill="#626779">nutrition details and a BMR calculator.</text><text x="985" y="1553" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#635bff">Meal data retrieval in under 5 seconds</text><text x="985" y="1590" font-family="Arial,sans-serif" font-size="13" fill="#626779">Express · MongoDB · EJS · CSS</text></g>
<text x="720" y="1690" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#635bff">COMPETITIVE PROGRAMMING</text><text x="720" y="1735" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#171923">Consistency beats intensity.</text>
